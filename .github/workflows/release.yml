name: Versioned Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'Merge pull request') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Parse version.yaml
        run: |
          echo "RUN=$(yq '.run' version.yaml)" >> $GITHUB_ENV
          echo "VERSION=$(yq '.version' version.yaml)" >> $GITHUB_ENV
          echo "DESC<<EOF" >> $GITHUB_ENV
          yq '.description' version.yaml >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Stop if run=false
        if: ${{ env.RUN == 'false' }}
        run: echo "run=false -> skipping release."

      - name: Set up Python
        if: ${{ env.RUN == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        if: ${{ env.RUN == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install build tomli tomli_w pytest requests

      - name: Run tests
        if: ${{ env.RUN == 'true' }}
        run: PYTHONPATH=src pytest -q

      - name: Inject version into pyproject.toml
        if: ${{ env.RUN == 'true' }}
        run: |
          python - <<'EOF'
          import tomli, tomli_w, os

          version = os.environ["VERSION"]

          with open("pyproject.toml", "rb") as f:
              d = tomli.load(f)

          d["project"]["version"] = version

          with open("pyproject.toml", "wb") as f:
              f.write(tomli_w.dumps(d).encode())
          EOF

      - name: Build package
        if: ${{ env.RUN == 'true' }}
        run: |
          rm -rf dist
          python -m build

      - name: Create GitHub Release
        if: ${{ env.RUN == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: ${{ env.DESC }}
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish to PyPI
        if: ${{ env.RUN == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true