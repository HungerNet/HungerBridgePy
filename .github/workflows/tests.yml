name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Unit and protocol tests
        run: pytest -q

  live-protocol:
    # Cross-language check: run the live suite against an in-process HungerBridge
    # server built from the HungerBridge repository (no Minecraft needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HungerNet/HungerBridge
          path: HungerBridge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[test]"
      - name: Start standalone HungerBridge
        working-directory: HungerBridge
        run: |
          ./gradlew :common:standaloneBridge --no-daemon -Phb.standalone.port=19130 > ../bridge.log 2>&1 &
          for i in $(seq 1 180); do grep -q '^PICKUP_URL=' ../bridge.log && break; sleep 1; done
          grep '^PICKUP_URL=' ../bridge.log | head -1 | cut -d= -f2- > ../pickup.txt
          test -s ../pickup.txt || (cat ../bridge.log; exit 1)
      - name: Live protocol tests
        run: HB_PICKUP_URL="$(cat pickup.txt)" HB_EXPECT_PLATFORM=standalone pytest -q -m live tests/test_live.py
      - name: Bridge log
        if: always()
        run: cat bridge.log || true
